# docker-java 从 classpath 读取本文件（DefaultDockerClientConfig.loadIncludedDockerProperties）。
#
# GitHub 托管 runner 的 Docker 引擎要求 API >= 1.40，
# 而 docker-java 3.4.1 默认按 1.32 协商，会报：
#   client version 1.32 is too old. Minimum supported API version is 1.40
#
# 注意：docker-java 不读 DOCKER_API_VERSION 环境变量
# （bytecode 中无该字符串，overrideDockerPropertiesWithEnv 只处理
#  DOCKER_HOST / DOCKER_CONTEXT 等固定键），因此必须落在本文件里。
api.version=1.44
